<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>currency converter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>LIVE RATES AND CONVERSIONS</h1>
      <p>CURRENCY CONVERTER</p>
    </header>
    <main>
      <form id="converter-form">
        <div class="form-group">
          <label for="amount">Amount:</label>
          <input type="number" id="amount" placeholder="Enter amount" required>
        </div>

        <div class="form-group">
          <label for="from-currency">From:</label>
          <div class="input-group">
            <input type="text" id="from-currency-input" placeholder="Enter currency">
            <select id="from-currency-dropdown">
              <option value="">Select Crypto currency</option>
              <!-- Options populated dynamically -->
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="to-currency">To:</label>
          <div class="input-group">
            <input type="text" id="to-currency-input" placeholder="Enter currency">
            <select id="to-currency-dropdown">
              <option value="">Select Crypto currency</option>
              <!-- Options populated dynamically -->
            </select>
          </div>
        </div>

        <button type="submit" class="btn">Convert</button>
      </form>
      <div id="result-container">
        <p id="result"></p>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
